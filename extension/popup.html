<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goodwork Job Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark">g.</span>
    <div><h1>Goodwork</h1><p>Job manager</p></div>
  </header>

  <section class="connection">
    <label for="api-url">Cloudflare Worker URL</label>
    <input id="api-url" type="url" placeholder="https://your-worker.workers.dev/api/jobs" autocomplete="url" required>
    <label for="admin-token">Admin key</label>
    <input id="admin-token" type="password" placeholder="Enter your Cloudflare secret" autocomplete="off" required>
    <p class="hint">Your admin key is only kept while this popup is open.</p>
    <button id="connect" class="primary" type="button">Connect to jobs</button>
  </section>

  <section id="manager" hidden>
    <div class="list-heading"><h2>Published jobs</h2><button id="add-job" class="secondary" type="button">+ Add job</button></div>
    <div id="job-list" class="job-list"></div>
  </section>

  <form id="job-form" hidden>
    <div class="list-heading"><h2 id="form-title">Add a job</h2><button id="cancel-edit" class="icon-button" type="button" aria-label="Cancel editing">×</button></div>
    <input id="job-id" type="hidden">
    <label for="title">Job title</label><input id="title" maxlength="160" required>
    <label for="company">Company</label><input id="company" maxlength="160" required>
    <label for="location">Location</label><input id="location" maxlength="160" placeholder="Remote · US" required>
    <div class="two-columns">
      <div><label for="category">Category</label><select id="category"><option>Design</option><option>Engineering</option><option>Marketing</option><option>Product</option></select></div>
      <div><label for="type">Employment type</label><select id="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></div>
    </div>
    <div class="two-columns">
      <div><label for="salary">Top salary (number)</label><input id="salary" type="number" min="0" max="100000000" required></div>
      <div><label for="salary-text">Salary range</label><input id="salary-text" maxlength="160" placeholder="$100k – $130k" required></div>
    </div>
    <label for="posted">Posted label</label><input id="posted" maxlength="160" value="Just posted" required>
    <div class="two-columns">
      <div><label for="color">Logo background</label><input id="color" type="color" value="#eaf1e2"></div>
      <div><label for="logo-color">Logo text</label><input id="logo-color" type="color" value="#64803f"></div>
    </div>
    <button id="save-job" class="primary" type="submit">Publish job</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
